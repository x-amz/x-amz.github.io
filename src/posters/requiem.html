<style>
    /* ═══ requiem — the seal, at monumental scale ═══ */
    .p-requiem { --acc: #C49A2C; align-items: center; text-align: center; padding: 2.2rem 1.3rem 1.3rem; }
    .p-requiem .title {
      font-family: var(--ivy); font-size: 3.4rem; line-height: 0.9;
      color: #E8DDC8;
    }
    .p-requiem .sub {
      font-family: var(--ivy); font-style: italic; font-size: 0.86rem;
      color: #8A6A55; margin-top: 0.3rem;
    }
    .p-requiem .fig {
      display: grid; grid-template-rows: minmax(0, 1fr); place-items: center;
      width: 100%; padding: 0.7rem 0;
    }
    .p-requiem canvas { display: block; }
    .p-requiem .seed {
      font-family: var(--serial); font-size: 0.42rem; letter-spacing: 0.13em;
      text-transform: uppercase; color: #7A5F52; line-height: 1.7;
    }
    .p-requiem .doc {
      font-family: var(--source); font-size: 0.4rem; line-height: 1.6;
      color: #6E5544; text-align: left; margin-top: 0.5rem;
      display: inline-block; white-space: pre;
    }
    .p-requiem .status { color: #C49A2C; margin-top: 0.7rem; font-size: 0.52rem; }

    /* From four-fifths square the seal takes the left half and the type stands
       beside it; below that the seal has more room in the stack. */
    @container stage (min-aspect-ratio: 4 / 5) {
      .p-requiem {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr); column-gap: 1.5rem;
        align-items: stretch; text-align: left; padding: 1.6rem 1.8rem 1.3rem;
      }
      .p-requiem .fig { grid-column: 1; grid-row: 1 / 3; padding: 0; }
      .p-requiem .head { grid-column: 2; grid-row: 1; }
      .p-requiem .foot { grid-column: 2; grid-row: 2; align-self: end; }
      .p-requiem .sub { margin-top: 0.5rem; }
    }
</style>

      <a class="poster p-requiem" href="https://requiem.rest">
        <div class="head">
          <p class="title">requiem</p>
          <p class="sub">.http for Shortcuts</p>
        </div>
        <div class="fig">
          <canvas id="requiem-seal" aria-label="Seal pressed from the SHA-256 of the document printed below"></canvas>
        </div>
        <div class="foot">
          <p class="seed">RequestModel.hash — sha-256 of the document below, first 16 bytes<br><span id="requiem-seed">·</span></p>
          <pre class="doc" id="requiem-doc"># requiem.http
GET https://requiem.rest
accept: text/html

###

GET https://req.to/9f3
accept: message/http</pre>
          <p class="status">App Store</p>
        </div>
      </a>

<script>
    // ── requiem — the seal is the one the app itself presses. RequestModel.hash
    //    (Requiem/data/RequestModel.swift:55) is SHA-256 over the document's UTF-8
    //    bytes truncated to the first 16, and it is the app's real identity for every
    //    document it imports. The seed is printed beneath the seal, so a reader can
    //    shasum the document and land on the same 32 characters.
    //    The canvas is laid out by CSS and re-pressed at whatever size it lands on.
    var docEl = document.getElementById('requiem-doc');
    var sealEl = document.getElementById('requiem-seal');
    if (docEl && sealEl) {
      var digest = SHA256.bytes(docEl.textContent);
      var hex = digest.map(function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
      document.getElementById('requiem-seed').textContent = hex.slice(0, 32) + '…';
      var room = sealEl.parentNode, pressed = 0;
      function press() {
        var r = room.getBoundingClientRect();
        var size = Math.floor(Math.min(r.width, r.height));
        if (!size || size === pressed) return;
        pressed = size;
        sealEl.style.width = sealEl.style.height = size + 'px';
        Ornaments.seal(sealEl, digest, {
          size: size, ink: '#C49A2C',
          lo: 'rgba(196,154,44,0.38)', hi: 'rgba(232,221,200,0.16)'
        });
      }
      press();
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(press).observe(room);
      else window.addEventListener('resize', press);
    }
</script>
