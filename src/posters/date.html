<!-- {"title": "x-amz.date", "description": "A CloudFront function returning the current time in the format the x-amz-date header takes.", "ideal": [1000, 1500], "k": [16.6, 24], "bleed": "#060605"} -->
<style>
    /* ═══ x-amz.date — the spine and the band ═══ */
    .p-date { --acc: #E6E1D3; }
    .p-date .fig { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    .p-date .spine {
      display: flex; flex-direction: column; justify-content: center;
      padding: 1rem 0 1rem 1.1rem; min-height: 0;
    }
    /* Sixteen characters divide the spine's height, whatever it is: the glyph
       shrinks before it overflows, and never grows past its set size. */
    .p-date .spine span {
      font-family: var(--serial); font-weight: 700;
      font-size: clamp(0.5rem, calc((100cqh - 12rem) / 16.4), 1.1rem);
      line-height: 1.02; color: #FFFFFF; letter-spacing: 0.02em;
    }
    .p-date .spine span.sep { color: #55554E; }
    .p-date .side {
      writing-mode: vertical-rl; text-orientation: mixed;
      font-family: var(--serial); font-size: 0.44rem; letter-spacing: 0.24em;
      text-transform: uppercase; color: #55554E;
      padding: 1.1rem 0.85rem; text-align: right;
    }
    .p-date .band { background: #E6E1D3; padding: 0.5rem 0.8rem 0.4rem; }
    .p-date .band svg { display: block; width: 100%; height: 2.2rem; }
    .p-date .band .lbl {
      font-family: var(--serial); font-size: 0.38rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: #3A3A34; margin-top: 0.2rem;
    }
    .p-date .foot { padding: 0.8rem 1.1rem 1rem; margin-top: 0; }
    .p-date .title {
      font-family: var(--serial); font-weight: 700; font-size: 0.85rem;
      letter-spacing: 0.12em; color: #E6E1D3;
    }
    .p-date .spec { color: #5C5C54; font-size: 0.4rem; line-height: 1.75; }
    .p-date .status { font-size: 0.5rem; letter-spacing: 0.18em; color: #9A9A90; margin-top: 0.2rem; }

    /* From three-quarters square upward the stamp lies across the top as a
       line, sized to the width it has. */
    @container stage (min-aspect-ratio: 3 / 4) {
      .p-date .fig { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; }
      .p-date .spine { flex-direction: row; justify-content: center; padding: 1rem 1.1rem 0.4rem; }
      .p-date .spine span { font-size: min(2.6rem, 5.6cqw); }
      .p-date .side { writing-mode: horizontal-tb; text-align: center; padding: 0 1.1rem 0.9rem; }
    }
</style>

      <a class="poster p-date" href="https://x-amz.date">
        <div class="fig">
          <div class="spine" id="date-spine"></div>
          <div class="side">x-amz-date · 16 bytes · no-store</div>
        </div>
        <div class="band">
          <div id="date-code"></div>
          <p class="lbl" id="date-lbl">code 128 · rendered at load</p>
        </div>
        <div class="foot">
          <p class="title">x-amz.date</p>
          <p class="spec">a cloudfront function returning yyyymmddThhmmssZ — the value the<br>x-amz-date header takes when you sign an aws request by hand</p>
          <p class="status">live · continuously</p>
        </div>
      </a>

<script>
    // ── x-amz.date — the served value, rendered now, in the served format.
    var now = new Date();
    function p2(n) { return (n < 10 ? '0' : '') + n; }
    var stamp = now.getUTCFullYear() + p2(now.getUTCMonth() + 1) + p2(now.getUTCDate()) +
                'T' + p2(now.getUTCHours()) + p2(now.getUTCMinutes()) + p2(now.getUTCSeconds()) + 'Z';
    var spineEl = document.getElementById('date-spine');
    if (spineEl) {
      Array.from(stamp).forEach(function (ch) {
        var s = document.createElement('span');
        s.textContent = ch;
        if (ch === 'T' || ch === 'Z') s.className = 'sep';
        spineEl.appendChild(s);
      });
    }
    try {
      document.getElementById('date-code').innerHTML = Code128.svg(stamp, 1.3, 44, '#141410');
      document.getElementById('date-lbl').textContent = stamp + ' · code 128 · scan to check the clock';
    } catch (e) { /* the band keeps its default caption */ }
</script>
