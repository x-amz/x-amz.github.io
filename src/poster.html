<!--{ poster script }-->
    // Reveal once the faces are in, so the poster never paints in a fallback
    // and swaps. Capped, so a stalled font never leaves the page blank.
    var root = document.documentElement, shown = false;
    function show() { if (!shown) { shown = true; root.className += ' ready'; } }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(show, show);
    setTimeout(show, 1500);
  })();
